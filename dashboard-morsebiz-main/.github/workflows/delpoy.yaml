name: Deploy Dashboard Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.0
        with:
          ssh-private-key: ${{ secrets.SERVER_PRIVATE_KEY }}
      
      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@74.225.254.175 "mkdir -p /home/azureuser/projects/dashboard.morsebiz.com"

          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            ./ azureuser@74.225.254.175:/home/azureuser/projects/dashboard.morsebiz.com/

          ssh -o StrictHostKeyChecking=no azureuser@74.225.254.175 << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(nvm current)/bin:$PATH"
            
            cd /home/azureuser/projects/dashboard.morsebiz.com
            npm ci
            npm run build
            pm2 delete dashboard.morsebiz.com 2>/dev/null || true
            pm2 start npm --name dashboard.morsebiz.com -- start -- -p 3002
            pm2 save
          EOF
